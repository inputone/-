spring.application.name=treehole
logging.level.org.springframework.boot.autoconfigure= INFO
spring.datasource.url=jdbc:mysql://localhost:3306/treehole?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=1234

spring.thymeleaf.cache=false

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.huanghaha.treehole.entity
mybatis.configuration.map-underscore-to-camel-case=true

treehole.forbid-words=fuck,shit, ass, bitch